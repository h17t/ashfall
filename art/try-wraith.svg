<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="256" height="320" viewBox="0 0 256 320">
<defs><filter id="ink" x="-15%" y="-15%" width="130%" height="130%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="3" seed="11" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="3.5" xChannelSelector="R" yChannelSelector="G" result="d"/>
    <feMorphology in="d" operator="erode" radius="0.35" result="e"/>
    <feGaussianBlur in="e" stdDeviation="0.35"/>
  </filter>
<filter id="inkFine" x="-15%" y="-15%" width="130%" height="130%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.08" numOctaves="3" seed="14" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6" xChannelSelector="R" yChannelSelector="G" result="d"/>
    <feMorphology in="d" operator="erode" radius="0.35" result="e"/>
    <feGaussianBlur in="e" stdDeviation="0.35"/>
  </filter>
<filter id="wash" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
    <feGaussianBlur in="SourceAlpha" stdDeviation="4" result="b"/>
    <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="22" result="n"/>
    <feDisplacementMap in="b" in2="n" scale="8" xChannelSelector="R" yChannelSelector="G" result="db"/>
    <feComposite in="db" in2="SourceAlpha" operator="in" result="pool"/>
    <feColorMatrix in="pool" type="matrix" values="0 0 0 0 0.03  0 0 0 0 0.02  0 0 0 0 0.02  0 0 0 0.9 0" result="dark"/>
    <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="dark"/></feMerge>
  </filter>
<filter id="paper" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
