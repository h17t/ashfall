name: ci
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: typecheck, tests (engine, asset audit, banned terms, migration), hover audit
        run: npm run typecheck && npm test && npm run lint:terms && npm run audit:hover
      - name: build
        run: npm run build
      - name: payload budget (shell gz, precache, time to playable on slow 4G at 4x CPU)
        run: npm run audit:budget
      - name: PWA completeness (manifest, icons, Apple tags, service worker)
        run: npm run audit:manifest
      - name: touch targets, accessibility and contrast, the device matrix, interruptions
        run: |
          npx vite preview --port 4173 &
          sleep 3
          node tools/audit/touch-targets.mjs
          node tools/audit/a11y.mjs
          node tools/audit/devices.mjs
          node tools/audit/interrupt.mjs
